<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrakis Registration</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="img-wrapper" aria-hidden="true">
      <img
        src="./assets/images/non-svg/spaceing-guild-logo.png"
        alt="logo of the spacing guild of the Dune universe"
        width="75"
        height="75"
      />
    </div>
    <div class="svg-wrapper" aria-hidden="true">
      <img
        src="./assets/images/svgs/house-atreides-logo.svg"
        alt="House Atreides logo of the dune universe"
        width="75"
        height="75"
      />
    </div>
    <div class="reg-wrapper">
      <form action="" method="post" aria-label="Registration" autocomplete="on">
        <fieldset>
          <legend>Sign up</legend>
          <div class="titling">
            <h1>Welcome to Arrakis!</h1>
            <p>Please fill out all information below</p>
          </div>
          <div class="control-wrapper">
            <div class="form-control-wrapper">
              <div class="form-control">
                <label for="first-name">First Name</label>
                <input
                  type="text"
                  name="firstName"
                  id="first-name"
                  required
                  placeholder="Paul"
                />
              </div>
              <div class="form-control">
                <label for="last-name">Last Name</label
                ><input
                  type="text"
                  name="lastName"
                  id="last-name"
                  required
                  placeholder="Atreides"
                />
              </div>
            </div>
            <div class="form-control-wrapper">
              <div class="form-control">
                <label for="mail">Email</label
                ><input
                  type="email"
                  name="email"
                  id="mail"
                  required
                  placeholder="usul@galactic.com"
                  autocomplete="on"
                />
              </div>
              <div class="form-control">
                <label for="phone">Phone Number</label
                ><input
                  type="tel"
                  name="phone"
                  id="phone"
                  required
                  placeholder="999-999-9999"
                  pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                />
              </div>
            </div>
            <div class="form-control-wrapper">
              <div class="form-control">
                <label for="password">Password</label
                ><input
                  type="password"
                  name="password"
                  id="password"
                  required
                  minlength="6"
                  placeholder=""
                />
              </div>
              <div class="form-control">
                <label for="confirm-pwd">Confirm Password</label
                ><input
                  type="password"
                  name="confirmPwd"
                  id="confirm-pwd"
                  required
                  minlength="6"
                  placeholder=""
                />
              </div>
            </div>
          </div>
          <div class="bottom">
            <div class="form-control">
              <button type="submit">Submit</button>
            </div>
            <div class="sign-in">
              Returning?<a href="#" target="_blank"><span>Click here</span></a>
            </div>
          </div>
        </fieldset>
      </form>
    </div>
  </body>
</html>
